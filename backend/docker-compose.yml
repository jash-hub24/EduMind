services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: edumind_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "3307:3306"
    volumes:
      - edumind-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/edumind_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
      DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in your environment}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  edumind-mysql-data: